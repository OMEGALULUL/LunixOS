<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>lunix: ~ — LUNIX</title>
<style>
  :root {
    --bg: #000000;
    --fg: #c9c9c9;
    --dim: #767676;
    --green: #4e9a06;
    --blue: #729fcf;
    --accent: #e95420;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; touch-action: manipulation; }
  body {
    background: radial-gradient(1300px 900px at 50% 24%, #17181d 0%, #0b0c0f 58%, #060708 100%) fixed;
    color: var(--fg);
    font-family: Consolas, "Cascadia Mono", "Ubuntu Mono", "DejaVu Sans Mono", "Liberation Mono", Menlo, monospace;
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
  }
  ::selection { background: var(--accent); color: #000; }

  /* ---- the terminal window, sitting on a desktop ---- */
  .window {
    position: fixed;
    inset: 18px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid #4a4a52;
    border-radius: 10px;
    box-shadow: 0 26px 80px rgba(0, 0, 0, .68), 0 3px 10px rgba(0, 0, 0, .5);
    overflow: hidden;
    transition: transform .24s ease, opacity .24s ease, inset .15s ease, border-radius .15s ease;
  }
  .window.max { inset: 0; border-radius: 0; border: 0; }
  .window.minimized { transform: translateY(105vh) scale(.35); opacity: 0; pointer-events: none; }

  .titlebar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 34px;
    padding: 0 12px;
    background: linear-gradient(#34343b, #29292e);
    border-bottom: 1px solid #151518;
    user-select: none;
    -webkit-user-select: none;
  }
  .tb-app {
    display: flex; align-items: center; gap: 7px;
    color: #b9b9bf; font-size: 11.5px; font-weight: bold; letter-spacing: .2px;
    flex-shrink: 0;
  }
  .tb-app .tico {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #ffd9a8, var(--accent) 72%);
    box-shadow: 0 0 7px rgba(233, 84, 32, .55);
  }
  .tb-title {
    flex: 1;
    text-align: center;
    color: #d2d2d7;
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 8px;
  }
  .tb-btns { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: 4px; }
  .tb-btn {
    width: 17px; height: 17px; border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, .5);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 9.5px; line-height: 1; font-family: inherit;
    color: transparent;
    background: linear-gradient(#58585f, #45454c);
    padding: 0;
  }
  .tb-btn:hover { color: #101013; }
  .tb-btn:active { filter: brightness(.82); }
  .tb-btn.close { background: linear-gradient(#ef6238, #d84d1e); }
  .tb-btn.close:hover { background: linear-gradient(#ff7a4d, var(--accent)); }

  /* ---- terminal inside the window ---- */
  .term {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    position: relative;
  }
  .term.bell { animation: bellflash .09s ease; }
  @keyframes bellflash { 50% { filter: invert(.08); } }
  .term .body {
    flex: 1;
    padding: 12px 14px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 0;
    user-select: text;
    -webkit-user-select: text;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: #37373e transparent;
  }
  .term .body::-webkit-scrollbar { width: 10px; }
  .term .body::-webkit-scrollbar-track { background: transparent; }
  .term .body::-webkit-scrollbar-thumb { background: #33333a; border-radius: 5px; border: 2px solid #000; }
  .term .body::-webkit-scrollbar-thumb:hover { background: #45454e; }

  .vt-line {
    display: flex; align-items: center;
    padding: 8px 14px 10px;
    border-top: 1px solid #1c1c1c;
    font-size: inherit;
  }
  .vt-line .prompt { color: var(--fg); white-space: pre-wrap; word-break: break-word; }
  .iline {
    flex: 1;
    position: relative;
    min-width: 60px;
    height: 1.5em;
    line-height: 1.5em;
    white-space: pre;
    overflow: hidden;
    margin-left: 6px;
  }
  .iline .ishift { position: absolute; left: 0; top: 0; white-space: pre; will-change: transform; }
  .iline .cursor {
    display: inline-block;
    width: .62em; height: 1.12em;
    vertical-align: -.16em;
    background: var(--fg);
  }
  html.cur-blink .iline .cursor { animation: blink 1.06s steps(1, start) infinite; }
  html.cur-idle .iline .cursor { animation: none; background: transparent; box-shadow: inset 0 0 0 1.5px var(--dim); }
  html.cur-idle.cur-blink .iline .cursor { animation: curfade 1.06s steps(1, start) infinite; }
  @keyframes curfade { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .45; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  #vt-input {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--fg);
    font: inherit;
    caret-color: var(--fg);
    min-width: 60px;
  }
  html.mirror #vt-input { color: transparent; caret-color: transparent; }
  html.mirror #vt-input::selection { background: rgba(233, 84, 32, .25); }
  .keys { display: none; }
  .keys button {
    background: #111;
    color: var(--fg);
    border: 1px solid #26262a;
    border-radius: 4px;
    font: inherit;
    line-height: 1;
    padding: 6px 12px;
    touch-action: manipulation;
  }
  .keys button:active { background: var(--accent); color: #000; }

  .dockpill {
    position: fixed;
    left: 14px; bottom: 14px;
    z-index: 60;
    display: none;
    align-items: center; gap: 8px;
    background: #202027;
    border: 1px solid #3a3a42;
    color: #cfcfd4;
    font-size: 12px;
    font-family: inherit;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .5);
  }
  .dockpill.on { display: flex; }
  .dockpill:hover { border-color: var(--accent); }

  @media (max-width: 700px) {
    .window { inset: 8px; border-radius: 8px; }
    .titlebar { height: 30px; gap: 6px; padding: 0 9px; }
    .tb-title { font-size: 11.5px; }
    body { font-size: 15px; }
    .term .body { padding: 10px; }
    .vt-line { padding: 8px 10px 10px; }
  }
  @media (pointer: coarse) {
    .keys { display: flex; gap: 6px; flex-shrink: 0; margin-left: 6px; }
    body, .vt-line { font-size: 16px; }
  }

  .u { color: var(--green); font-weight: 700; }
  .p { color: var(--blue); font-weight: 700; }
  .dim { color: var(--dim); }
  .warn { color: #ff8c00; font-weight: bold; }
  .accent { color: var(--accent); }
  .blue { color: var(--blue); font-weight: 700; }
  .green { color: var(--green); }
  .ok { color: var(--green); }
  .fatal { color: var(--accent); }

  .tmux {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    gap: 10px;
    background: #16161b;
    border-top: 1px solid #26262c;
    color: #9a9aa2;
    font-size: 11.5px;
    line-height: 1.2;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  .tmux b { color: #d7d7dc; font-weight: normal; }
  .tseg {
    display: flex; align-items: center;
    background: var(--green);
    color: #07230c;
    font-weight: bold;
    letter-spacing: .3px;
    padding: 4px 9px;
    white-space: nowrap;
  }
  .tseg.win { background: #232329; color: #c9c9cf; }
  .tright { display: flex; align-items: stretch; min-width: 0; }
  .tright .cell {
    display: flex; align-items: center;
    padding: 0 9px;
    border-left: 1px solid #26262c;
    white-space: nowrap;
  }
  .tright .cell.dim { color: #6f6f77; }
  .tright .clk {
    background: #232329;
    color: #d7d7dc;
    font-weight: bold;
    padding: 4px 10px;
  }
  .tleft { display: flex; align-items: stretch; min-width: 0; }
  .twins { display: flex; align-items: stretch; min-width: 0; overflow: hidden; }
  .tseg.win {
    cursor: pointer;
    border: 0;
    border-right: 1px solid #101014;
    background: #232329;
    color: #b9b9bf;
    font-weight: normal;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: normal;
    padding: 4px 9px;
    white-space: nowrap;
  }
  .tseg.win:hover { background: #2d2d35; color: #e8e8ec; }
  .tseg.win.cur { background: var(--green); color: #07230c; font-weight: bold; }
  .tnew {
    background: transparent;
    border: 0;
    color: var(--green);
    font-weight: bold;
    font-size: 14px;
    font-family: inherit;
    line-height: 1;
    padding: 4px 11px;
    cursor: pointer;
  }
  .tnew:hover { background: #233018; color: #a5e37c; }
  .tmux.armed #t-sess { background: var(--accent); color: #fff; }

  .boot {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: radial-gradient(1300px 900px at 50% 24%, #101014 0%, #060708 70%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    transition: opacity .6s ease;
  }
  .boot.done { opacity: 0; pointer-events: none; }
  .boot pre { color: var(--accent); line-height: 1.12; margin-bottom: 24px; text-align: center; }
  .boot pre .peng { color: #d6d6d6; }
  .boot .log { color: var(--dim); text-align: left; width: 100%; max-width: 780px; font-size: 13px; }
  .boot .line { animation: fadein .2s ease; white-space: pre-wrap; }
  .boot .lbl { color: var(--dim); }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* ---- nano editor overlay ---- */
  .nano {
    position: absolute;
    inset: 0;
    z-index: 40;
    background: #000;
    display: flex;
    flex-direction: column;
  }
  .nano .nano-title {
    background: var(--accent);
    color: #000;
    font-weight: bold;
    text-align: center;
    padding: 2px 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nano textarea {
    flex: 1;
    background: #000;
    color: var(--fg);
    border: 0;
    outline: none;
    resize: none;
    font: inherit;
    line-height: 1.5;
    padding: 8px 12px;
    white-space: pre;
    overflow: auto;
  }
  .nano .nano-keys {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 14px;
    background: #111;
    border-top: 1px solid #26262a;
    color: var(--dim);
    font-size: 12px;
    padding: 4px 10px;
    user-select: none;
  }
  .nano .nano-keys b { color: var(--fg); font-weight: normal; }

  /* ---- vid player ---- */
  .vidbox {
    position: absolute;
    right: 14px;
    bottom: 48px;
    z-index: 45;
    width: min(480px, calc(100% - 28px));
    background: #0a0a0a;
    border: 1px solid #26262a;
    box-shadow: 0 8px 40px rgba(0, 0, 0, .8);
  }
  .vidbox .vid-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: #111;
    color: var(--fg);
    font-size: 12px;
    padding: 4px 8px;
    border-bottom: 1px solid #26262a;
  }
  .vidbox .vid-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vidbox .vid-close { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 0 4px; }
  .vidbox video { display: block; width: 100%; max-height: 60vh; background: #000; }
</style>
</head>
<body>

<div class="window" id="appwin">

  <header class="titlebar">
    <span class="tb-app"><span class="tico"></span><span>Terminal</span></span>
    <span class="tb-title" id="wt-title">lunix login:</span>
    <span class="tb-btns">
      <button class="tb-btn min" data-wbtn="min" title="minimize" aria-label="minimize window">&#8211;</button>
      <button class="tb-btn maxb" data-wbtn="max" title="maximize" aria-label="maximize window">&#9633;</button>
      <button class="tb-btn close" data-wbtn="close" title="poweroff (purges the session)" aria-label="close window">&#10005;</button>
    </span>
  </header>

  <div class="term">
    <div class="body" id="vt-body"></div>
    <div class="vt-line">
      <span class="prompt" id="vt-prompt"></span>
      <span class="iline" id="vt-iline"><span class="ishift" id="vt-ishift"><span id="vt-mirpre"></span><span class="cursor" id="vt-cursor"></span><span id="vt-mirpost"></span></span><input id="vt-input" autocomplete="off" autocapitalize="off" spellcheck="false" autocorrect="off" enterkeyhint="send" aria-label="terminal input"></span>
      <div class="keys">
        <button data-key="newshell" aria-label="new shell">+</button>
        <button data-key="tab" aria-label="tab complete">⇥</button>
        <button data-key="up" aria-label="previous command">↑</button>
        <button data-key="enter" aria-label="enter">⏎</button>
      </div>
    </div>

    <div class="tmux" id="t-bar">
      <span class="tleft">
        <span class="tseg" id="t-sess">[lunix]</span>
        <span class="twins" id="t-wins"></span>
        <button class="tnew" data-newwin="1" title="new window (Ctrl-B c)" aria-label="new shell">+</button>
      </span>
      <span class="tright">
        <span class="cell">uptime <b id="t-up">0s</b></span>
        <span class="cell">pkgs <b id="t-pk">0</b></span>
        <span class="cell dim" id="t-sid">—</span>
        <span class="cell clk" id="t-clk">--:--</span>
      </span>
    </div>
  </div>

</div>

<button class="dockpill" id="dockpill" title="restore terminal"><span style="color:var(--green);">▲</span> lunix — session alive</button>

<div class="boot" id="boot">
  <pre id="boot-banner"></pre>
  <div class="log" id="boot-log"></div>
</div>

<script>
"use strict";
var SID = (Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6)).toUpperCase();
/* ---- deployment config ------------------------------------------------
   hosted on http/https : everything is same-origin. nothing to change.
   opened from file://  : set FALLBACK_API to YOUR worker url to enable
                          bucket features locally, or leave "" for a fully
                          offline sim (save/music-from-bucket just say so). */
var FALLBACK_API = "";
var API = location.protocol === "file:" ? FALLBACK_API : "";
var body = document.getElementById("vt-body");
var input = document.getElementById("vt-input");
var promptEl = document.getElementById("vt-prompt");
var t = function (id, v) { document.getElementById(id).textContent = v; };
var bootT = Date.now();
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function uptimeStr() {
  var s = Math.floor((Date.now() - bootT) / 1000);
  if (s < 60) return s + "s";
  var m = Math.floor(s / 60), h = Math.floor(m / 60);
  return h ? h + "h " + (m % 60) + "m" : m + "m " + (s % 60) + "s";
}
setInterval(function () {
  var d = new Date();
  t("t-up", uptimeStr());
  t("t-clk", pad2(d.getHours()) + ":" + pad2(d.getMinutes()));
}, 1000);
(function () { var d = new Date(); t("t-clk", pad2(d.getHours()) + ":" + pad2(d.getMinutes())); })();
t("t-sid", "#" + SID);

var PKGS = {
  bash:        { size: 2.1,  desc: "the bourne again shell. the shell lunix stole its voice from" },
  "build-base":{ size: 25.1, desc: "gcc, musl-dev, make. everything to build nothing in a browser" },
  cowsay:      { size: 0.1,  desc: "a cow with opinions. essential" },
  curl:        { size: 3.2,  desc: "transfers data to places that do not exist" },
  docker:      { size: 0,    desc: "the whale is also simulated. everything is. accept it" },
  fish:        { size: 5.4,  desc: "a shell that thinks it is better than you" },
  git:         { size: 14.5, desc: "version control for code that lives 30 seconds" },
  htop:        { size: 0.5,  desc: "a task manager for the one task: pretending" },
  jq:          { size: 1.8,  desc: "jq is a programming language wearing a trench coat" },
  lolcat:      { size: 0.02, desc: "rainbows, but terminal" },
  neovim:      { size: 12.4, desc: "a text editor that consumes your life" },
  nginx:       { size: 2.4,  desc: "a web server for websites that do not exist" },
  nodejs:      { size: 24.6, desc: "javascript pretending to be a server" },
  openssh:     { size: 6.2,  desc: "ssh into your own delusion" },
  python3:     { size: 18.2, desc: "a snake that writes code for you (simulated)" },
  ripgrep:     { size: 4.3,  desc: "finds text, faster than you can read it" },
  tmux:        { size: 1.9,  desc: "terminals inside terminals inside browser" },
  tree:        { size: 0.1,  desc: "a forest of directories" },
  vim:         { size: 7.8,  desc: "the other text editor. do not start a war" },
  wget:        { size: 1.6,  desc: "curl, but from the 90s" },
  zsh:         { size: 3.4,  desc: "the shell everyone configures and nobody uses" }
};

var STATE_V = 2;
var DEFAULT_FS = {
  "/": { type: "dir", kids: ["etc", "home", "root", "tmp", "usr", "var"] },
  "/etc": { type: "dir", kids: ["os-release", "hostname", "motd"] },
  "/etc/os-release": { type: "file", data: 'NAME="LUNIX"\nID=lunix\nVERSION_ID="2026.08"\nPRETTY_NAME="LUNIX 2026.08 (browser)"\nHOME_URL="https://lunix.blueberryservices.co.za"\nSUPPORT_URL="https://lunix.blueberryservices.co.za"\nBUG_REPORT_URL="nowhere. it is a feature"\n' },
  "/etc/hostname": { type: "file", data: "lunix\n" },
  "/etc/motd": { type: "file", data: "welcome to lunix. everything you install dies when the tab closes. that is the point.\n" },
  "/home": { type: "dir", kids: ["lunix"] },
  "/home/lunix": { type: "dir", kids: [] },
  "/root": { type: "dir", kids: [] },
  "/tmp": { type: "dir", kids: [] },
  "/usr": { type: "dir", kids: [] },
  "/var": { type: "dir", kids: [] }
};
var fs = {};
for (var k in DEFAULT_FS) fs[k] = DEFAULT_FS[k];
var cwd = "/home/lunix";
var user = "lunix";
var pkgs = {};
var hist = [];

// native core — rust compiled to wasm (source: rust/lunix-core). optional by
// design: if the fetch fails the sim runs exactly as before and commands that
// need the module say so instead of breaking.
var CORE = null;
var CORE_READY = (function () {
  if (typeof WebAssembly === "undefined" || location.protocol === "file:") return Promise.resolve(false);
  return fetch("assets/lunix_core.wasm")
    .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.arrayBuffer(); })
    .then(function (b) { return WebAssembly.instantiate(new Uint8Array(b)); })
    .then(function (res) {
      var e = res.instance.exports;
      if (e.lunix_abi() !== 1) throw new Error("abi " + e.lunix_abi());
      CORE = e;
      return true;
    })
    .catch(function () { return false; });
})();
function coreRun(str) {
  var bts = new TextEncoder().encode(str);
  var p = CORE.lunix_mem_alloc(Math.max(bts.length, 1));
  try {
    new Uint8Array(CORE.memory.buffer, p, bts.length).set(bts);
    return { crc: CORE.lunix_cksum(p, bts.length) >>> 0, len: bts.length };
  } finally { CORE.lunix_mem_reset(); }
}

// rebuild every dir's kids array from the actual key set
function rekids() {
  for (var p in fs) if (fs[p].type === "dir") fs[p].kids = [];
  Object.keys(fs).sort().forEach(function (q) {
    if (q === "/") return;
    var par = parent(q);
    if (fs[par] && fs[par].type === "dir" && fs[par].kids.indexOf(leaf(q)) === -1) fs[par].kids.push(leaf(q));
  });
}

try {
  var saved = JSON.parse(sessionStorage.getItem("lunix-state") || "null");
  if (saved && saved.fs) {
    pkgs = saved.pkgs || {};
    cwd = saved.cwd || cwd;
    user = saved.user || user;
    if (saved.v === STATE_V) {
      for (var sk in fs) delete fs[sk];
      for (var sk2 in saved.fs) fs[sk2] = saved.fs[sk2];
    } else {
      // migration from an older build: keep the user's files, rebuild on top of
      // the current seed skeleton, and drop dev-test leftovers (tst & friends)
      var junk = /^\/(home\/lunix|root|tmp)\/(.+\/)?tst$/;
      for (var sp in saved.fs) {
        if (junk.test(sp)) continue;
        if (fs[sp] && fs[sp].type === "dir" && saved.fs[sp].type !== "dir") continue;
        fs[sp] = saved.fs[sp];
        if (saved.fs[sp].type === "dir") continue;
        var par = parent(sp);
        while (par !== "/" && !fs[par]) { fs[par] = { type: "dir", kids: [] }; par = parent(par); }
      }
      rekids();
      saveState();
    }
  }
} catch (e) {}

/* ---- tmux-style windows: each shell owns cwd/user/history/screen ---- */
var shells = [];
var activeShell = 0;
(function initShells() {
  var savedShells = null, savedAct = 0;
  try {
    var raw = JSON.parse(sessionStorage.getItem("lunix-state") || "null");
    if (raw) { savedShells = raw.shells || null; savedAct = raw.act || 0; }
  } catch (e6) {}
  if (savedShells && savedShells.length) {
    shells = savedShells.map(function (sd) {
      var s = makeShell();
      s.name = sd.name || "bash";
      s.cwd = sd.cwd || s.cwd;
      s.user = sd.user || "lunix";
      s.hist = sd.hist || [];

function runPing(opts, host, ip) {
  var seq = 0, sent = 0, recv = 0, times = [];
  var start = Date.now();
  print("PING " + host + " (" + ip + ") " + opts.size + "(" + (opts.size + 28) + ") bytes of data.");
  var iv = setInterval(function () {
    if (seq >= opts.count) {
      clearInterval(iv);
      var elapsed = Date.now() - start;
      var loss = Math.round((sent - recv) / sent * 100);
      var avg = times.length ? times.reduce(function (a, b) { return a + b; }, 0) / times.length : 0;
      var mn = times.length ? Math.min.apply(null, times) : 0;
      var mx = times.length ? Math.max.apply(null, times) : 0;
      var mdev = times.length ? times.reduce(function (a, b) { return a + Math.abs(b - avg); }, 0) / times.length : 0;
      print("--- " + host + " ping statistics ---");
      print(sent + " packets transmitted, " + recv + " received, " + loss + "% packet loss, time " + elapsed + "ms");
      if (times.length) print("rtt min/avg/max/mdev = " + mn.toFixed(3) + "/" + avg.toFixed(3) + "/" + mx.toFixed(3) + "/" + mdev.toFixed(3) + " ms");
      return;
    }
    seq++;
    sent++;
    var drop = Math.random() < 0.03 && sent < opts.count;
    var t = ip === "127.0.0.1" ? 0.02 + Math.random() * 0.05 : ip === "192.168.86.100" ? 0.3 + Math.random() * 0.8 : 8 + Math.random() * 45;
    var ttl = ip === "127.0.0.1" || ip === "192.168.86.100" ? 64 : opts.ttl || (Math.random() < 0.5 ? 52 + Math.floor(Math.random() * 12) : 110 + Math.floor(Math.random() * 8));
    if (!opts.quiet && !drop) print("64 bytes from " + ip + ": icmp_seq=" + seq + " ttl=" + ttl + " time=" + t.toFixed(1) + " ms");
    else if (!opts.quiet) print("Request timeout for icmp_seq " + seq);
    if (!drop) { recv++; times.push(t); }
  }, opts.interval * 1000);
}

function boot() {
  var overlay = document.getElementById("boot");
  var banner = document.getElementById("boot-banner");
  var log = document.getElementById("boot-log");
  var PENGUIN = "     .--.\n" +
                "    |o_o |\n" +
                "    |:_/ |\n" +
                "   //   \\ \\\n" +
                "  (|     | )\n" +
                "  /'\\_   _/`\\\n" +
                "  \\___)=(___/";
  banner.innerHTML = figlet("LUNIX") + "\n\n<span class='peng'>" + PENGUIN + "</span>";
  log.innerHTML = "";
  overlay.classList.remove("done");
  body.innerHTML = "";
  var i = 0;
  var iv = setInterval(function () {
    if (i >= BOOT_LINES.length) {
      clearInterval(iv);
      setTimeout(function () {
        overlay.classList.add("done");
        showLogin();
        input.focus();
      }, 600);
      return;
    }
    var l = BOOT_LINES[i++];
    var d = document.createElement("div");
    d.className = "line";
    if (l.t) {
      /* kernel ring-buffer line: right-aligned timestamp in a 12-char field */
      d.innerHTML = "<span class='lbl'>[" + ("            " + l.t).slice(-12) + "]</span> " + esc(l.m);
    } else if (l.ok || l.fatal) {
      var st = l.ok ? "[  OK  ]" : "[FAILED]";
      var col = l.ok ? "ok" : "fatal";
      d.innerHTML = "<span class='" + col + "'>" + st + "</span> " + esc(l.m);
    } else {
      /* "Starting X..." — indented to align under the unit status column */
      d.innerHTML = "<span class='lbl'>         </span>" + esc(l.m);
    }
    log.appendChild(d);
  }, 130);
}

function snapActive() {

/* ---- readline-style editing, history, completion, search ---- */
var histIdx = null;
var draftLine = "";

function caretEnd() {
  var l = input.value.length;
  try { input.setSelectionRange(l, l); } catch (e2) {}
  drawCaret();
}

function histStep(dir) {
  if (!hist.length) return;
  if (histIdx === null) {
    if (dir > 0) return;
    draftLine = input.value;
    histIdx = hist.length - 1;
  } else {
    histIdx += dir;
    if (histIdx >= hist.length) { histIdx = null; input.value = draftLine; caretEnd(); return; }
    if (histIdx < 0) histIdx = 0;
  }
  input.value = hist[histIdx];
  caretEnd();
}

function wordKill() {
  var pos = input.selectionEnd;
  if (pos == null) pos = input.value.length;
  var m = input.value.slice(0, pos).match(/\s*\S+\s*$/);
  if (!m) return;
  input.value = input.value.slice(0, m.index) + input.value.slice(pos);
  input.setSelectionRange(m.index, m.index);
  drawCaret();
}

function selInOutput() {
  try {
    var s = document.getSelection();
    return !!(s && s.rangeCount && !s.isCollapsed && body.contains(s.anchorNode));
  } catch (e3) { return false; }
}

function bellFlash() {
  var tm = document.querySelector(".term");
  if (!tm) return;
  tm.classList.remove("bell");
  void tm.offsetWidth;
  tm.classList.add("bell");
}

function lcpOf(arr) {
  if (!arr.length) return "";
  var p = arr[0];
  for (var i = 1; i < arr.length; i++) {
    var j = 0;
    while (j < p.length && j < arr[i].length && p[j] === arr[i][j]) j++;
    p = p.slice(0, j);
  }
  return p;
}

function completeInput() {
  var v = input.value;
  var trailing = /\s$/.test(v);
  var toks = v.match(/"[^"]*"|\S+/g) || [];
  var cand = [], partial = "";
  if (toks.length === 0 || (toks.length === 1 && !trailing)) {
    partial = toks[0] || "";
    cand = Object.keys(CMDS).filter(function (n) { return n.indexOf(partial) === 0 && n !== partial; }).sort();
  } else {
    partial = trailing ? "" : toks[toks.length - 1];
    var slash = partial.lastIndexOf("/");
    var dirPart = slash >= 0 ? partial.slice(0, slash + 1) : "";
    var namePart = slash >= 0 ? partial.slice(slash + 1) : partial;
    var base = norm(resolve(dirPart || "."));
    if (exists(base) && typeOf(base) === "dir") {
      cand = (fs[base].kids || []).filter(function (n) { return n.indexOf(namePart) === 0; }).sort().map(function (n) {
        var full = dirPart + n;
        return full + (typeOf(norm(resolve(full))) === "dir" ? "/" : "");
      });
    }
  }
  if (!cand.length) return bellFlash();
  var lcp = lcpOf(cand);
  if (cand.length === 1 && lcp.slice(-1) !== "/") lcp += " ";
  if (lcp.length > partial.length || (trailing && lcp)) {
    input.value = trailing ? v + lcp : v.slice(0, v.length - partial.length) + lcp;
    caretEnd();
  } else if (cand.length > 1) {
    printHtml("<span class='dim'>" + cand.map(esc).join("&nbsp;&nbsp;") + "</span>");
  }

/* ---- reverse-i-search ---- */
var rsOn = false, rsQ = "", rsBack = "", rsAt = -1;

  if (!rsQ) return -1;
  for (var i = from; i >= 0; i--) if (hist[i].indexOf(rsQ) !== -1) return i;

  caretEnd();

/* ---- login ---- */
function loginSubmit(v) {
  var uname = v.trim() || "lunix";
  print("lunix login: " + (v.trim() || "lunix"));
  user = uname;
  var hd = home();
  if (!exists(hd)) {
    fs[hd] = { type: "dir", kids: [] };
    if (fs["/home"].kids.indexOf(uname) === -1) fs["/home"].kids.push(uname);
  }
  cwd = hd;
  print("Last login: " + new Date().toString() + " on pts/0");
  print(fs["/etc/motd"].data.replace(/\n$/, ""));
  saveState();
  showPrompt();

/* ---- block cursor: the input's text is mirrored, the real caret is hidden ---- */
var mirPre = document.getElementById("vt-mirpre");
var mirPost = document.getElementById("vt-mirpost");

    var hidden = input.type === "password";

/* ---- the main key handler ---- */
var tmuxPrefix = false;
input.addEventListener("keydown", function (e) {
  var k = e.key || "", ckey = k.toLowerCase(), ctrl = e.ctrlKey && !e.altKey && !e.metaKey;

  /* tmux prefix: Ctrl-B, then c / n / p / 0-9 */
  if (tmuxPrefix) {
    tmuxPrefix = false;
    document.getElementById("t-bar").classList.remove("armed");
    e.preventDefault();
    if (ctrl || e.metaKey || e.altKey) return;
    if (k === "c") addShell();
    else if (k === "n") switchShell((activeShell + 1) % shells.length);
    else if (k === "p") switchShell((activeShell - 1 + shells.length) % shells.length);
    else if (k === "&") killShell(activeShell);
    else if (/^[0-9]$/.test(k)) {
      if (+k < shells.length) switchShell(+k);
      else bellFlash();
    }
    return;
  }
  if (ctrl && ckey === "b" && !e.shiftKey && !loginMode && !pwPending && !rsOn) {
    tmuxPrefix = true;
    e.preventDefault();
    document.getElementById("t-bar").classList.add("armed");
    setTimeout(function () { tmuxPrefix = false; document.getElementById("t-bar").classList.remove("armed"); }, 1500);
    return;
  }

  if (rsOn) {
    if (k === "Escape" || (ctrl && (ckey === "c" || ckey === "g"))) {
      e.preventDefault();
      rsExit(true);
      return;
    }
    if (k === "Enter") {
      e.preventDefault();
      var acc = input.value;
      rsOn = false;
      printHtml(promptHtml() + " " + esc(acc));
      handleCmd(acc);
      if (!loginMode && !pwPending && input.type !== "password") showPrompt();
      return;
    }
    if (ctrl && ckey === "r") {
      e.preventDefault();
      rsUpdate(rsAt >= 0 ? rsAt - 1 : hist.length - 1);
      return;
    }
    if (k === "Backspace") {
      e.preventDefault();
      rsQ = rsQ.slice(0, -1);
      rsUpdate(hist.length - 1);
      return;
    }
    if (!ctrl && !e.metaKey && !e.altKey && k.length === 1) {
      e.preventDefault();
      rsQ += k;
      rsUpdate(hist.length - 1);
      return;
    }
    if (k === "ArrowUp" || k === "ArrowDown") { e.preventDefault(); return; }
    if (k === "ArrowLeft" || k === "ArrowRight" || k === "Home" || k === "End") rsExit(false);
    return;

  if (ctrl) {
    if (ckey === "c" && selInOutput()) return; /* let the browser copy the selected output */
    switch (ckey) {
      case "c":
        e.preventDefault();
        printHtml((loginMode ? "lunix login: " + esc(input.value) : promptHtml() + " " + esc(input.value)) + "<span class='dim'>^C</span>");

        return;
      case "l":
        e.preventDefault();
        body.innerHTML = "";
        return;
      case "u": {
        e.preventDefault();
        var pu = input.selectionStart || 0;
        input.value = input.value.slice(pu);
        input.setSelectionRange(0, 0);
        drawCaret();
        return;
      }
      case "k": {
        e.preventDefault();
        var pk = input.selectionStart || 0;
        input.value = input.value.slice(0, pk);
        input.setSelectionRange(pk, pk);
        drawCaret();
        return;
      }
      case "w":
        e.preventDefault();
        wordKill();
        return;
      case "a":
        e.preventDefault();
        input.setSelectionRange(0, 0);
        drawCaret();
        return;
      case "e": {
        e.preventDefault();
        var pe = input.value.length;
        input.setSelectionRange(pe, pe);
        drawCaret();
        return;
      }
      case "r":
        e.preventDefault();

        return;
      case "d":

    e.preventDefault();

    if (pwPending) {
      input.type = "text";
      var cb = pwPending;

      input.value = "";
      cb(v);
      return;
    }
    if (loginMode) { loginSubmit(v); return; }
    printHtml(promptHtml() + " " + esc(v));
    handleCmd(v);
    /* exit/poweroff/askPw may have taken over the line — only redraw when still shelling */

    return;

  if (!b) return;
  e.preventDefault();
  var k = b.getAttribute("data-key");
  if (k === "up") histStep(-1);
  else if (k === "tab") { input.focus(); completeInput(); }
  else if (k === "newshell") addShell();
  else if (k === "enter") input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
  input.focus();
});
document.addEventListener("click", function (e) {
  var nb = e.target && e.target.closest ? e.target.closest("[data-newwin]") : null;
  if (nb) {
    e.preventDefault();
    addShell();
    input.focus();
    return;
  }
  var sb = e.target && e.target.closest ? e.target.closest("[data-shell]") : null;
  if (!sb) return;
  e.preventDefault();
  switchShell(parseInt(sb.getAttribute("data-shell"), 10));
  input.focus();
});

/* ---- title bar buttons ---- */
document.addEventListener("click", function (e) {
  var b = e.target && e.target.closest ? e.target.closest("[data-wbtn]") : null;
  if (!b) return;
  e.preventDefault();
  var act = b.getAttribute("data-wbtn");
  var win = document.getElementById("appwin");
  var pill = document.getElementById("dockpill");
  if (!win) return;
  if (act === "close") {
    if (confirm("poweroff lunix?\n\nthis purges the whole session — everything dies with the tab.")) endIt();
  } else if (act === "max") {
    win.classList.toggle("max");
    input.focus();
  } else if (act === "min") {
    win.classList.add("minimized");
    if (pill) pill.classList.add("on");
  }
});
var dockPill = document.getElementById("dockpill");
if (dockPill) dockPill.addEventListener("click", function () {
  var win = document.getElementById("appwin");
  if (win) win.classList.remove("minimized");
  dockPill.classList.remove("on");
  input.focus();
});

function figlet(text) {
  var t = text.toUpperCase().split("");
  if (t.length > 24) return "figlet: text too long (max 24 chars)";
  var lines = ["", "", "", "", ""];
  for (var i = 0; i < t.length; i++) {
    var glyph = FONT[t[i]] || FONT[" "];
    for (var r = 0; r < 5; r++) lines[r] += glyph[r] + " ";
  }
  return lines.join("\n");
}
