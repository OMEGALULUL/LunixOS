<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lunix: ~ — LUNIX</title>
<style>
  :root {
    --bg: #000000;
    --fg: #c9c9c9;
    --dim: #767676;
    --green: #4e9a06;
    --blue: #729fcf;
    --accent: #e95420;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Consolas, "Cascadia Mono", "Ubuntu Mono", "Courier New", monospace;
    font-size: 14px;
    line-height: 1.6;
  }
  ::selection { background: var(--accent); color: #000; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 8px; min-height: 100%; display: flex; flex-direction: column; }

  .term {
    background: #000;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 30px);
  }
  .term .body {
    flex: 1;
    padding: 12px 14px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 0;
  }
  .vt-line {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-top: 1px solid #1c1c1c;
  }
  .vt-line .prompt { color: var(--fg); white-space: nowrap; }
  #vt-input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--fg);
    font: inherit;
    caret-color: var(--fg);
    min-width: 60px;
  }

  .u { color: var(--green); font-weight: 700; }
  .p { color: var(--blue); font-weight: 700; }
  .dim { color: var(--dim); }
  .accent { color: var(--accent); }
  .blue { color: var(--blue); font-weight: 700; }
  .green { color: var(--green); }
  .ok { color: var(--green); }
  .fatal { color: var(--accent); }

  .tmux {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: #111;
    border-top: 1px solid #26262a;
    color: var(--dim);
    font-size: 12px;
    padding: 5px 12px;
    user-select: none;
  }
  .tmux b { color: var(--fg); font-weight: normal; }

  .boot {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    transition: opacity .6s ease;
  }
  .boot.done { opacity: 0; pointer-events: none; }
  .boot pre { color: var(--accent); line-height: 1.12; margin-bottom: 24px; text-align: center; }
  .boot pre .peng { color: #d6d6d6; }
  .boot .log { color: var(--dim); text-align: left; width: 100%; max-width: 720px; font-size: 13px; }
  .boot .line { animation: fadein .2s ease; }
  .boot .lbl { color: var(--dim); }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div class="wrap">

  <div class="term">
    <div class="body" id="vt-body"></div>
    <div class="vt-line">
      <span class="prompt" id="vt-prompt"></span>
      <input id="vt-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="terminal input">
    </div>
  </div>

  <div class="boot" id="boot">
    <pre id="boot-banner"></pre>
    <div class="log" id="boot-log"></div>
  </div>

  <div class="tmux">
    <span>0:bash* — <b>lunix</b> — simulated install</span>
    <span>uptime <b id="t-up">0s</b> · pkgs <b id="t-pk">0</b> · session <b id="t-sid">—</b> · poweroff purges</span>
  </div>

</div>

<script>
"use strict";
var SID = (Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6)).toUpperCase();
var body = document.getElementById("vt-body");
var input = document.getElementById("vt-input");
var promptEl = document.getElementById("vt-prompt");
var t = function (id, v) { document.getElementById(id).textContent = v; };
var bootT = Date.now();
setInterval(function () {
  var s = Math.floor((Date.now() - bootT) / 1000);
  t("t-up", s + "s");
}, 1000);
t("t-sid", SID);

var PKGS = {
  bash:        { size: 2.1,  desc: "the bourne again shell. the shell lunix stole its voice from" },
  "build-base":{ size: 25.1, desc: "gcc, musl-dev, make. everything to build nothing in a browser" },
  cowsay:      { size: 0.1,  desc: "a cow with opinions. essential" },
  curl:        { size: 3.2,  desc: "transfers data to places that do not exist" },
  docker:      { size: 0,    desc: "the whale is also simulated. everything is. accept it" },
  fish:        { size: 5.4,  desc: "a shell that thinks it is better than you" },
  git:         { size: 14.5, desc: "version control for code that lives 30 seconds" },
  htop:        { size: 0.5,  desc: "a task manager for the one task: pretending" },
  jq:          { size: 1.8,  desc: "jq is a programming language wearing a trench coat" },
  lolcat:      { size: 0.02, desc: "rainbows, but terminal" },
  neovim:      { size: 12.4, desc: "a text editor that consumes your life" },
  nginx:       { size: 2.4,  desc: "a web server for websites that do not exist" },
  nodejs:      { size: 24.6, desc: "javascript pretending to be a server" },
  openssh:     { size: 6.2,  desc: "ssh into your own delusion" },
  python3:     { size: 18.2, desc: "a snake that writes code for you" },
  ripgrep:     { size: 4.3,  desc: "finds text, faster than you can read it" },
  tmux:        { size: 1.9,  desc: "terminals inside terminals inside browser" },
  tree:        { size: 0.1,  desc: "a forest of directories" },
  vim:         { size: 7.8,  desc: "the other text editor. do not start a war" },
  wget:        { size: 1.6,  desc: "curl, but from the 90s" },
  zsh:         { size: 3.4,  desc: "the shell everyone configures and nobody uses" }
};

var fs = {
  "/": { type: "dir", kids: ["etc", "home", "root", "tmp", "usr", "var"] },
  "/etc": { type: "dir", kids: ["os-release", "hostname", "motd"] },
  "/etc/os-release": { type: "file", data: 'NAME="LUNIX"\nID=lunix\nVERSION_ID="2026.08"\nPRETTY_NAME="LUNIX 2026.08 (browser)"\nHOME_URL="https://lunix.blueberryservices.co.za"\nSUPPORT_URL="https://lunix.blueberryservices.co.za"\nBUG_REPORT_URL="nowhere. it is a feature"\n' },
  "/etc/hostname": { type: "file", data: "lunix\n" },
  "/etc/motd": { type: "file", data: "welcome to lunix. everything you install dies when the tab closes. that is the point.\n" },
  "/home": { type: "dir", kids: ["lunix"] },
  "/home/lunix": { type: "dir", kids: [] },
  "/root": { type: "dir", kids: [] },
  "/tmp": { type: "dir", kids: [] },
  "/usr": { type: "dir", kids: [] },
  "/var": { type: "dir", kids: [] }
};
var cwd = "/home/lunix";
var user = "lunix";
var pkgs = {};
var hist = [];

try {
  var saved = sessionStorage.getItem("lunix-state");
  if (saved) {
    var s = JSON.parse(saved);
    var keys = Object.keys(fs);
    for (var i = 0; i < keys.length; i++) delete fs[keys[i]];
    for (var k in s.fs) fs[k] = s.fs[k];
    pkgs = s.pkgs || {};
    cwd = s.cwd || cwd;
    user = s.user || user;
  }
} catch (e) {}
t("t-pk", Object.keys(pkgs).length);

function saveState() {
  try {
    sessionStorage.setItem("lunix-state", JSON.stringify({ fs: fs, pkgs: pkgs, cwd: cwd, user: user }));
  } catch (e) {}
}

function out(html) {
  var div = document.createElement("div");
  div.innerHTML = html;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function print(s, cls) {
  out('<span class="' + (cls || "") + '">' + esc(s) + "</span>");
}
function printHtml(html) {
  out(html);
}
function err(msg) {
  print(msg);
}
function home() {
  return user === "root" ? "/root" : "/home/" + user;
}
function promptPath() {
  var h = home();
  if (cwd === h) return "~";
  if (cwd.indexOf(h + "/") === 0) return "~" + cwd.slice(h.length);
  return cwd;
}
function promptHtml() {
  return "<span class='u'>" + esc(user) + "@lunix</span>:<span class='p'>" + esc(promptPath()) + "</span>" + (user === "root" ? "#" : "$");
}
function typeOf(p) {
  return fs[p] ? (fs[p].type === "dir" ? "dir" : "file") : null;
}
function resolve(path) {
  if (path.indexOf("/") === 0) {
    var parts = path.split("/").filter(Boolean);
    return "/" + parts.join("/");
  }
  var stack = [];
  var parts = (cwd + "/" + path).split("/").filter(Boolean);
  for (var i = 0; i < parts.length; i++) {
    if (parts[i] === ".") continue;
    if (parts[i] === "..") { stack.pop(); continue; }
    stack.push(parts[i]);
  }
  return "/" + stack.join("/");
}
function norm(p) {
  return p === "/" ? "/" : p.replace(/\/+$/, "");
}
function parent(p) {
  var i = p.lastIndexOf("/");
  return i <= 0 ? "/" : p.slice(0, i);
}
function exists(p) {
  if (p === "/") return true;
  return fs[p] !== undefined;
}
function leaf(p) {
  return p === "/" ? "/" : p.slice(p.lastIndexOf("/") + 1);
}
function pad(n, w) { return (n + "                    ").slice(0, w); }

var CMDS = {
  help: function (args) {
    printHtml("available commands (this is a simulation. a lovely one)<br>" +
      "&nbsp;&nbsp;<span class='accent'>ls</span> [-l]&nbsp;&nbsp;<span class='accent'>cd</span> &lt;dir&gt;&nbsp;&nbsp;<span class='accent'>cat</span> &lt;file&gt;&nbsp;&nbsp;<span class='accent'>pwd</span>&nbsp;&nbsp;<span class='accent'>mkdir</span>&nbsp;&nbsp;<span class='accent'>touch</span>&nbsp;&nbsp;<span class='accent'>rm</span>&nbsp;&nbsp;<span class='accent'>mv</span>&nbsp;&nbsp;<span class='accent'>cp</span>&nbsp;&nbsp;<span class='accent'>tree</span><br>" +
      "&nbsp;&nbsp;<span class='accent'>whoami</span>&nbsp;&nbsp;<span class='accent'>id</span>&nbsp;&nbsp;<span class='accent'>uname</span>&nbsp;&nbsp;<span class='accent'>hostname</span>&nbsp;&nbsp;<span class='accent'>uptime</span>&nbsp;&nbsp;<span class='accent'>date</span>&nbsp;&nbsp;<span class='accent'>free</span>&nbsp;&nbsp;<span class='accent'>history</span>&nbsp;&nbsp;<span class='accent'>clear</span><br>" +
      "&nbsp;&nbsp;<span class='accent'>apk update|add|del|search|info</span>&nbsp;&nbsp;<span class='accent'>ping</span>&nbsp;&nbsp;<span class='accent'>curl</span>&nbsp;&nbsp;<span class='accent'>wget</span><br>" +
      "&nbsp;&nbsp;<span class='accent'>sudo</span>&nbsp;&nbsp;<span class='accent'>su</span>&nbsp;&nbsp;<span class='accent'>exit</span>&nbsp;&nbsp;<span class='accent'>reboot</span>&nbsp;&nbsp;<span class='accent'>poweroff</span>&nbsp;&nbsp;<span class='accent'>end</span><br>" +
      "installed tools light up: <span class='accent'>cowsay</span> <span class='accent'>python3</span> <span class='accent'>git</span> <span class='accent'>node</span> <span class='accent'>htop</span> <span class='accent'>lolcat</span> <span class='accent'>docker</span> ...");
  },
  clear: function () { body.innerHTML = ""; },
  ls: function (args) {
    var la = args.indexOf("-la") !== -1 || args.indexOf("-l") !== -1 || args.indexOf("-al") !== -1;
    var target = "";
    for (var i = 0; i < args.length; i++) if (args[i].indexOf("-") !== 0) target = args[i];
    var tgt = norm(resolve(target || "."));
    if (!exists(tgt)) return err("ls: cannot access '" + target + "': No such file or directory");
    if (typeOf(tgt) !== "dir") { print(fs[tgt].data || ""); return; }
    var kids = (fs[tgt].kids || []).slice().sort();
    if (la) {
      for (var k = 0; k < kids.length; k++) {
        var full = (tgt === "/" ? "" : tgt) + "/" + kids[k];
        if (typeOf(full) === "dir") print("drwxr-xr-x  2 " + user + " " + user + " 4096 <span class='blue'>" + esc(kids[k]) + "</span>");
        else print("-rw-r--r--  1 " + user + " " + user + " " + pad(String(fs[full].data.length), 4) + " " + esc(kids[k]));
      }
      if (target && typeOf(tgt) === "dir") printHtml("<span class='dim'>total " + kids.length + "</span>");
    } else {
      var row = [];
      for (var j = 0; j < kids.length; j++) {
        var fp = (tgt === "/" ? "" : tgt) + "/" + kids[j];
        row.push(typeOf(fp) === "dir" ? "<span class='blue'>" + esc(kids[j]) + "</span>" : esc(kids[j]));
      }
      printHtml(row.join("&nbsp;&nbsp;&nbsp;"));
    }
  },
  cd: function (args) {
    if (!args.length) { cwd = home(); promptEl.innerHTML = promptHtml(); return saveState(); }
    var tgt = norm(resolve(args[0]));
    if (!exists(tgt)) return err("cd: no such file or directory: " + args[0]);
    if (typeOf(tgt) !== "dir") return err("cd: not a directory: " + args[0]);
    cwd = tgt;
    promptEl.innerHTML = promptHtml();
    document.title = "lunix: " + promptPath() + " — LUNIX";
    saveState();
  },
  pwd: function () { print(cwd); },
  cat: function (args) {
    if (!args.length) return err("cat: missing operand — try <span class='accent'>cat /etc/os-release</span>");
    var tgt = norm(resolve(args[0]));
    if (!exists(tgt)) return err("cat: " + args[0] + ": No such file or directory");
    if (typeOf(tgt) === "dir") return err("cat: " + args[0] + ": Is a directory");
    print(fs[tgt].data || "");
  },
  echo: function (args) {
    if (!args.length) { print(""); return; }
    print(args.join(" "));
  },
  mkdir: function (args) {
    if (!args.length) return err("mkdir: missing operand");
    for (var i = 0; i < args.length; i++) {
      var tgt = norm(resolve(args[i]));
      if (exists(tgt)) return err("mkdir: cannot create directory '" + args[i] + "': File exists");
      fs[tgt] = { type: "dir", kids: [] };
      var p = parent(tgt);
      if (fs[p] && fs[p].kids && fs[p].kids.indexOf(leaf(tgt)) === -1) fs[p].kids.push(leaf(tgt));
    }
    saveState();
  },
  touch: function (args) {
    if (!args.length) return err("touch: missing operand");
    for (var i = 0; i < args.length; i++) {
      var tgt = norm(resolve(args[i]));
      if (!exists(tgt)) {
        fs[tgt] = { type: "file", data: "" };
        var p = parent(tgt);
        if (fs[p] && fs[p].kids && fs[p].kids.indexOf(leaf(tgt)) === -1) fs[p].kids.push(leaf(tgt));
      }
    }
    saveState();
  },
  rm: function (args) {
    if (args[0] === "-r" || args[0] === "-rf" || args[0] === "-f") args = args.slice(1);
    if (!args.length) return err("rm: missing operand");
    for (var i = 0; i < args.length; i++) {
      var tgt = norm(resolve(args[i]));
      if (!exists(tgt)) return err("rm: cannot remove '" + args[i] + "': No such file or directory");
      delete fs[tgt];
      var p = parent(tgt);
      if (fs[p] && fs[p].kids) fs[p].kids = fs[p].kids.filter(function (k) { return (p === "/" ? "/" + k : p + "/" + k) !== tgt; });
    }
    saveState();
  },
  mv: function (args) {
    if (args.length < 2) return err("mv: missing operand");
    var tgt = norm(resolve(args[0]));
    var dst = norm(resolve(args[1]));
    if (!exists(tgt)) return err("mv: cannot stat '" + args[0] + "': No such file or directory");
    var dest = exists(dst) && typeOf(dst) === "dir" ? dst + "/" + leaf(tgt) : dst;
    fs[dest] = fs[tgt];
    delete fs[tgt];
    var p = parent(tgt);
    if (fs[p] && fs[p].kids) fs[p].kids = fs[p].kids.filter(function (k) { return (p === "/" ? "/" + k : p + "/" + k) !== tgt; });
    var dp = parent(dest);
    if (fs[dp] && fs[dp].kids && fs[dp].kids.indexOf(leaf(dest)) === -1) fs[dp].kids.push(leaf(dest));
    saveState();
  },
  cp: function (args) {
    if (args.length < 2) return err("cp: missing operand");
    var tgt = norm(resolve(args[0]));
    var dst = norm(resolve(args[1]));
    if (!exists(tgt)) return err("cp: cannot stat '" + args[0] + "': No such file or directory");
    var dest = exists(dst) && typeOf(dst) === "dir" ? dst + "/" + leaf(tgt) : dst;
    fs[dest] = JSON.parse(JSON.stringify(fs[tgt]));
    var dp = parent(dest);
    if (fs[dp] && fs[dp].kids && fs[dp].kids.indexOf(leaf(dest)) === -1) fs[dp].kids.push(leaf(dest));
    saveState();
  },
  tree: function (args) {
    if (!pkgs.tree) return err("tree: command not found. install it: apk add tree");
    var walk = function (p, prefix) {
      var kids = (fs[p] && fs[p].kids) || [];
      for (var i = 0; i < kids.length; i++) {
        var cp = (p === "/" ? "" : p) + "/" + kids[i];
        var isDir = typeOf(cp) === "dir";
        var branch = i === kids.length - 1 ? "`-- " : "|-- ";
        print(prefix + branch + kids[i] + (isDir ? "/" : ""));
        if (isDir) walk(cp, prefix + (i === kids.length - 1 ? "    " : "|   "));
      }
    };
    print(cwd === "/" ? "/" : cwd);
    walk(cwd, "");
  },
  whoami: function () { print(user); },
  id: function () {
    print(user === "root" ? "uid=0(root) gid=0(root) groups=0(root)" : "uid=1000(" + user + ") gid=1000(" + user + ") groups=1000(" + user + "),10(wheel)");
  },
  uname: function (args) {
    if (args.indexOf("-a") !== -1) return print("LUNIX lunix 6.6.browser-0-lunix #1-LUNIX SMP PREEMPT_DYNAMIC " + new Date().toDateString() + " x86_64 GNU/Linux");
    if (args.indexOf("-r") !== -1) return print("6.6.browser-0-lunix");
    if (args.indexOf("-m") !== -1) return print("x86_64");
    print("LUNIX");
  },
  hostname: function () { print("lunix"); },
  uptime: function () {
    var s = Math.floor((Date.now() - bootT) / 1000);
    var m = Math.floor(s / 60);
    print(" " + (m ? m + " min" : s + " sec") + " up, 1 user, load average: 0.00, 0.00, 0.00 (pretending)");
  },
  date: function () { print(new Date().toString()); },
  free: function () {
    var used = 64 + Object.keys(pkgs).length * 2;
    printHtml("               total        used        free      shared  buff/cache   available<br>" +
      "Mem:           512M         " + used + "M        " + (448 - Object.keys(pkgs).length * 2) + "M        0K       0K        " + (448 - Object.keys(pkgs).length * 2) + "M<br>" +
      "Swap:            0B          0B          0B");
  },
  sudo: function (args) {
    if (!args.length) return print("usage: sudo <command> (there is nothing to escalate to)");
    print(user + " is not in the sudoers file. this incident will be reported to the void.");
  },
  su: function (args) {
    if (args[0] === "root") {
      if (user === "root") return print("you are already root. root is a state of mind.");
      user = "root";
      promptEl.innerHTML = promptHtml();
      saveState();
      return print("root # (careful, you are unstoppable now)");
    }
    print("su: only root is available, and root is a state of mind.");
  },
  exit: function () {
    print("logout");
    user = "lunix";
    cwd = "/home/lunix";
    saveState();
    showLogin();
  },
  reboot: function () {
    boot();
  },
  history: function () {
    for (var i = 0; i < hist.length; i++) print("  " + (i + 1) + "  " + hist[i]);
  },
  ping: function (args) {
    var host = args[0] || "1.1.1.1";
    var times = [0.11, 0.09, 0.12, 0.10];
    print("PING " + host + " (the browser) 56(84) bytes of data.");
    for (var i = 0; i < times.length; i++) print("64 bytes from " + host + ": icmp_seq=" + (i + 1) + " ttl=57 time=" + times[i].toFixed(2) + " ms");
    print("--- " + host + " ping statistics ---");
    print("4 packets transmitted, 4 received, 0% packet loss, time 0ms — through the cloud, which is here");
  },
  curl: function (args) {
    var u = args[args.length - 1] || "";
    if (u.indexOf("-") === 0) return print("curl: the real curl is not installed. but the real curl also would not work, because the internet is simulated.");
    var host = u.replace(/^https?:\/\//, "").split(/[/?#]/)[0];
    if (host.indexOf("lunix") !== -1 || u.indexOf("blueberryservices") !== -1) {
      print("curl: nothing to see here. this IS the internet.");
      return;
    }
    printHtml("<html><head><title>" + (host || "example") + "</title></head><body><h1>this website does not exist</h1><p>but if it did, it would be served instantly from the cloud.</p><p>the cloud is in your browser. everything is in your browser.</p></body></html>");
  },
  wget: function () { print("wget: this is curl's 90s cousin. use curl. or do not. both fake."); },
  apk: function (args) {
    var sub = args[0];
    if (!sub) return print("usage: apk update | add <pkg...> | del <pkg...> | search <term> | info <pkg>");
    if (sub === "update") {
      print("fetching https://dl-cdn.alpinelinux.org/alpine/v3.22/main/x86_64/APKINDEX.tar.gz");
      print("fetching https://dl-cdn.alpinelinux.org/alpine/v3.22/community/x86_64/APKINDEX.tar.gz");
      print("(1/1) installing simulated index [##########] 100%");
      print("OK: 2 repositories, " + Object.keys(PKGS).length + " packages indexed. all of them are you.");
      return;
    }
    if (sub === "add") {
      if (!args[1]) return err("apk add: need at least one package name");
      var want = args.slice(1);
      var missing = [];
      for (var i = 0; i < want.length; i++) if (!PKGS[want[i]]) missing.push(want[i]);
      if (missing.length) return err("apk add: package not found: " + missing.join(" ") + " (the index has " + Object.keys(PKGS).length + " packages. that is all of them)");
      var total = 0;
      for (var j = 0; j < want.length; j++) {
        if (pkgs[want[j]]) { print("apk add: " + want[j] + ": already installed"); continue; }
        var kb = Math.round(PKGS[want[j]].size * 1024);
        total += PKGS[want[j]].size;
        print("(1/1) installing " + want[j] + " (" + kb + " KiB) [##########] 100%");
        pkgs[want[j]] = true;
      }
      saveState();
      t("t-pk", Object.keys(pkgs).length);
      print("OK: " + total.toFixed(1) + " MiB in " + want.length + " packages (all simulated, all free, all yours until the tab dies)");
      return;
    }
    if (sub === "del") {
      if (!args[1]) return err("apk del: need at least one package name");
      for (var d = 0; d < args.slice(1).length; d++) {
        var pn = args.slice(1)[d];
        if (!pkgs[pn]) { err("apk del: " + pn + " is not installed"); continue; }
        delete pkgs[pn];
        print("(1/1) purging " + pn + " [##########] 100%");
      }
      saveState();
      t("t-pk", Object.keys(pkgs).length);
      print("OK: " + args.slice(1).length + " packages purged. they were never real.");
      return;
    }
    if (sub === "search") {
      if (!args[1]) return err("apk search: need a term");
      var hits = Object.keys(PKGS).filter(function (p) { return p.indexOf(args[1]) !== -1; });
      for (var s = 0; s < hits.length; s++) printHtml("<span class='dim'>" + esc(hits[s]) + " - " + esc(PKGS[hits[s]].desc) + "</span>");
      return;
    }
    if (sub === "info") {
      if (!args[1]) return err("apk info: need a package name");
      var pk = PKGS[args[1]];
      if (!pk) return err("apk info: package not found: " + args[1]);
      printHtml("<span class='accent'>" + esc(args[1]) + ":</span><br>  description: " + esc(pk.desc) + "<br>  size: " + pk.size + " MiB (virtual)<br>  installed: " + (pkgs[args[1]] ? "yes" : "no"));
      return;
    }
    print("apk: unknown subcommand " + sub + " (this is the whole apk. it is small.)");
  },

function endIt() {
  print("lunix: the purge is complete. nothing you did here ever happened.");
  print("powering off...");
  try { sessionStorage.removeItem("lunix-state"); } catch (e) {}
  pkgs = {};
  setTimeout(boot, 900);
}

function handleCmd(raw) {
  var line = raw.trim();
  if (!line) return;
  hist.push(line);
  var parts = line.split(/\s*&&\s*/);
  for (var i = 0; i < parts.length; i++) {
    var args = parts[i].match(/"[^"]*"|\S+/g) || [];
    var cmd = (args.shift() || "").toLowerCase();
    var clean = [];
    for (var j = 0; j < args.length; j++) clean.push(args[j].replace(/^"|"$/g, ""));
    if (CMDS[cmd]) CMDS[cmd](clean);
    else err(cmd + ": command not found. the void does not know " + cmd + ". try: help");
  }
}

    d.innerHTML = "[    " + l.t + "] " + (color ? "<span class='" + color + "'>" + status + "</span>" : status) + "<span class='lbl'>" + esc(l.m) + "</span>";

  }, 280);
}

}

var loginMode = true;

input.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    e.preventDefault();
    var v = input.value;
    if (loginMode) {
      var uname = v.trim() || "lunix";
      print("lunix login: " + (v.trim() || "lunix"));
      user = uname;
      print("Last login: " + new Date().toString() + " on pts/0");
      print(fs["/etc/motd"].data.replace(/\n$/, ""));
      saveState();
      showPrompt();
      return;
    }
    printHtml(promptHtml() + " " + esc(v));
    handleCmd(v);
    showPrompt();
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (hist.length) {
      input.value = hist[hist.length - 1];
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }
});

function figlet(text) {
  var t = text.toUpperCase().split("");
  if (t.length > 24) return "figlet: text too long (max 24 chars)";
  var lines = ["", "", "", "", ""];
  for (var i = 0; i < t.length; i++) {
    var glyph = FONT[t[i]] || FONT[" "];
    for (var r = 0; r < 5; r++) lines[r] += glyph[r] + " ";
  }
  return lines.join("\n");
}
